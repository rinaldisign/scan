<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan OCR – Layout Asli (EN + JP)</title>
<style>
:root{--bg:#f4f5f7;--p:#fff;--t:#1c1f24;--m:#6b7280;--a:#2563eb;--b:#d9dce1}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--p:#1e2127;--t:#e8eaed;--m:#9aa0a8;--a:#5b8def;--b:#333842}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--t);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--p);border-bottom:1px solid var(--b)}
h1{font-size:16px;margin:0 8px 0 0}
button,select,label.btn{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--b);border-radius:8px;background:var(--p);color:var(--t);cursor:pointer}
button.primary{background:var(--a);border-color:var(--a);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
label.chk{font-size:13px;color:var(--m);display:flex;gap:6px;align-items:center}
#status{font-size:13px;color:var(--m);margin-left:auto;min-width:200px;text-align:right}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:0}
section{background:var(--p);border:1px solid var(--b);border-radius:10px;display:flex;flex-direction:column;min-height:0}
section h2{font-size:13px;margin:0;padding:9px 12px;border-bottom:1px solid var(--b);color:var(--m);font-weight:600}
.scroll{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty{margin:auto;color:var(--m);font-size:14px;text-align:center;padding:20px}
#drop.over{outline:2px dashed var(--a);outline-offset:-6px}
.in img{width:100%;max-width:820px;border:1px solid var(--b);background:#fff}
.page{container-type:inline-size;position:relative;width:100%;max-width:820px;background:#fff;background-size:100% 100%;border:1px solid var(--b);box-shadow:0 1px 4px #0002;flex:none}
.page span{position:absolute;white-space:pre;transform-origin:0 50%;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,Arial,sans-serif;outline:none;overflow:visible}
.page span:hover{background:#2563eb22}
.pn{font-size:12px;color:var(--m);align-self:flex-start;margin-bottom:-6px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-auto-rows:minmax(60vh,auto)}body{height:auto}}
</style></head>
<body>
<header>
  <h1>📄 Scan OCR</h1>
  <label class="btn">Pilih JPG / PDF<input id="file" type="file" accept="image/*,application/pdf" multiple hidden></label>
  <label class="chk"><input id="keep" type="checkbox" checked> Pertahankan gambar/grafik</label>
  <button id="gen" class="primary" disabled>Generate</button>
  <button id="dlw" disabled>Unduh Word</button>
  <button id="dlp" disabled>Unduh PDF</button>
  <span id="status">Pilih file atau seret ke panel kiri.</span>
</header>
<main>
  <section id="drop"><h2>Dokumen asli</h2><div class="scroll in" id="inp"><div class="empty">Belum ada file.<br>Klik “Pilih JPG / PDF” atau seret file ke sini.</div></div></section>
  <section><h2>Hasil OCR (posisi sesuai asli, teks bisa diklik &amp; diedit)</h2><div class="scroll" id="out"><div class="empty">Hasil akan muncul di sini setelah klik Generate.</div></div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script>
const $=s=>document.querySelector(s);
const FONT='"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,Arial,sans-serif';
let pages=[],busy=false;
const setStatus=t=>$('#status').textContent=t;
const lock=b=>{busy=b;$('#gen').disabled=b||!pages.length;$('#file').disabled=b;};

/* ---------- Input ---------- */
async function loadPdfWorker(){
  if(pdfjsLib.GlobalWorkerOptions._ok)return;
  const r=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(await r.blob());
  pdfjsLib.GlobalWorkerOptions._ok=true;
}
function loadImg(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Gambar tidak bisa dibaca: '+f.name));i.src=URL.createObjectURL(f);});}
function mkPage(canvas){return{canvas,W:canvas.width,H:canvas.height,lines:[],bg:null,bgUrl:'',src:canvas.toDataURL('image/jpeg',.85)};}
async function handleFiles(files){
  if(busy||!files.length)return;
  lock(true);pages=[];$('#out').innerHTML='<div class="empty">Hasil akan muncul di sini setelah klik Generate.</div>';
  $('#dlw').disabled=$('#dlp').disabled=true;
  try{
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        setStatus('Membaca PDF…');await loadPdfWorker();
        const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let n=1;n<=pdf.numPages;n++){
          setStatus(`Merender ${f.name} hal. ${n}/${pdf.numPages}`);
          const pg=await pdf.getPage(n),v1=pg.getViewport({scale:1});
          const sc=Math.min(3,Math.max(1,2400/v1.width)),vp=pg.getViewport({scale:sc});
          const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
          const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
          await pg.render({canvasContext:x,viewport:vp}).promise;pages.push(mkPage(c));
        }
      }else if(f.type.startsWith('image/')){
        const im=await loadImg(f),w=im.naturalWidth,s=w<2000?2000/w:w>3000?3000/w:1;
        const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(im.naturalHeight*s);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);pages.push(mkPage(c));
      }
    }
    if(!pages.length)throw new Error('Format tidak didukung. Gunakan JPG/PNG atau PDF.');
    $('#inp').innerHTML='';pages.forEach(p=>{const i=new Image();i.src=p.src;$('#inp').appendChild(i);});
    setStatus(`${pages.length} halaman siap. Klik Generate.`);
  }catch(e){console.error(e);setStatus('Error: '+e.message);pages=[];}
  lock(false);
}
$('#file').onchange=e=>{handleFiles([...e.target.files]);e.target.value='';};
const dz=$('#drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFiles([...e.dataTransfer.files]);};

/* ---------- OCR ---------- */
const CJK='[\\u3000-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef]';
const reSp=new RegExp(`(?<=${CJK})\\s+(?=${CJK})`,'g');
function extractLines(d){
  let L=d.lines;
  if(!L||!L.length){L=[];(d.blocks||[]).forEach(b=>b.paragraphs.forEach(p=>p.lines.forEach(l=>L.push(l))));}
  return L;
}
$('#gen').onclick=async()=>{
  if(busy||!pages.length)return;lock(true);$('#dlw').disabled=$('#dlp').disabled=true;
  let worker;
  try{
    let pi=0;
    worker=await Tesseract.createWorker('jpn+eng',1,{langPath:'https://tessdata.projectnaptha.com/4.0.0_best',gzip:true,logger:m=>{
      if(m.status)setStatus(`Hal. ${pi+1}/${pages.length} – ${m.status} ${m.progress?Math.round(m.progress*100)+'%':''}`);}});
    await worker.setParameters({preserve_interword_spaces:'1'});
    const m=document.createElement('canvas').getContext('2d');
    for(pi=0;pi<pages.length;pi++){
      const p=pages[pi];
      const {data}=await worker.recognize(p.canvas);
      p.lines=[];
      for(const l of extractLines(data)){
        const t=(l.text||'').replace(/\s*\n\s*/g,' ').replace(reSp,'').trim();
        const hasCJK=new RegExp(CJK).test(t),minC=hasCJK?5:35;
        if(!t||l.confidence<minC||(t.length<=1&&l.confidence<(hasCJK?30:70)))continue;
        const b=l.bbox,w=b.x1-b.x0,h=b.y1-b.y0;if(w<2||h<4)continue;
        const fs=h*.85;m.font=`${fs}px ${FONT}`;
        const nat=m.measureText(t).width||1;
        p.lines.push({t,x:b.x0,y:b.y0,w,h,fs,sx:Math.min(3,Math.max(.3,w/nat))});
      }
    }
    setStatus('Menyusun preview…');
    buildAll();$('#dlw').disabled=$('#dlp').disabled=false;
    setStatus(`Selesai: ${pages.reduce((a,p)=>a+p.lines.length,0)} baris teks dari ${pages.length} halaman.`);
  }catch(e){console.error(e);setStatus('Error OCR: '+e.message+' (cek koneksi internet)');}
  try{if(worker)await worker.terminate();}catch(_){}
  lock(false);
};
$('#keep').onchange=()=>{if(pages.some(p=>p.lines.length))buildAll();};

/* ---------- Background (hapus teks, sisakan gambar) + preview ---------- */
function buildBg(p,keep){
  const c=document.createElement('canvas');c.width=p.W;c.height=p.H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,p.W,p.H);
  if(!keep){p.lines.forEach(l=>{l.color='#000000';});}
  else{
    x.drawImage(p.canvas,0,0);
    const sx=p.canvas.getContext('2d');
    p.lines.forEach(l=>{
      const pad=3,X0=Math.max(0,l.x-pad),Y0=Math.max(0,l.y-pad),X1=Math.min(p.W-1,l.x+l.w+pad),Y1=Math.min(p.H-1,l.y+l.h+pad);
      let r=0,g=0,b=0;
      [[X0,Y0],[X1,Y0],[X0,Y1],[X1,Y1]].forEach(([a,d])=>{const px=sx.getImageData(Math.round(a),Math.round(d),1,1).data;r+=px[0];g+=px[1];b+=px[2];});
      r=Math.round(r/4);g=Math.round(g/4);b=Math.round(b/4);
      x.fillStyle=`rgb(${r},${g},${b})`;x.fillRect(X0,Y0,X1-X0+1,Y1-Y0+1);
      l.color=(0.299*r+0.587*g+0.114*b)>140?'#000000':'#ffffff';
    });
  }
  p.bg=c;p.bgUrl=c.toDataURL('image/jpeg',.9);
}
function buildAll(){
  const keep=$('#keep').checked,box=$('#out');box.innerHTML='';
  pages.forEach((p,i)=>{
    buildBg(p,keep);
    const n=document.createElement('div');n.className='pn';n.textContent='Halaman '+(i+1);box.appendChild(n);
    const pg=document.createElement('div');pg.className='page';pg.style.aspectRatio=p.W+'/'+p.H;pg.style.backgroundImage=`url(${p.bgUrl})`;
    p.lines.forEach(l=>{
      const s=document.createElement('span');s.contentEditable='true';s.spellcheck=false;s.textContent=l.t;
      s.style.cssText=`left:${l.x/p.W*100}%;top:${l.y/p.H*100}%;font-size:${l.fs/p.W*100}cqw;line-height:${l.h/p.W*100}cqw;height:${l.h/p.W*100}cqw;color:${l.color};transform:scaleX(${l.sx})`;
      s.oninput=()=>{l.t=s.textContent.replace(/\n/g,' ');};
      s.onkeydown=e=>{if(e.key==='Enter')e.preventDefault();};
      pg.appendChild(s);
    });
    box.appendChild(pg);
  });
}

/* ---------- Export ---------- */
function pageCanvas(p){
  const c=document.createElement('canvas');c.width=p.W;c.height=p.H;const x=c.getContext('2d');
  x.drawImage(p.bg,0,0);x.textBaseline='middle';
  p.lines.forEach(l=>{x.save();x.font=`${l.fs}px ${FONT}`;x.fillStyle=l.color;x.translate(l.x,l.y+l.h/2);x.scale(l.sx,1);x.fillText(l.t,0,0);x.restore();});
  return c;
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
$('#dlp').onclick=()=>{
  try{
    const {jsPDF}=window.jspdf,W=595.28;let doc;
    pages.forEach((p,i)=>{
      const H=W*p.H/p.W,o=W>H?'l':'p';
      if(i===0)doc=new jsPDF({unit:'pt',format:[W,H],orientation:o});else doc.addPage([W,H],o);
      doc.addImage(pageCanvas(p).toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
    });
    doc.save('hasil-ocr.pdf');
  }catch(e){console.error(e);setStatus('Gagal membuat PDF: '+e.message);}
};
const u8=url=>{const b=atob(url.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
$('#dlw').onclick=async()=>{
  try{
    setStatus('Membuat Word…');
    const D=docx,sections=pages.map(p=>{
      const k=794/p.W,tw=v=>Math.round(v*k*15),pw=tw(p.W),ph=tw(p.H);
      const kids=[new D.Paragraph({spacing:{before:0,after:0},children:[new D.ImageRun({
        data:u8(p.bgUrl),type:'jpg',transformation:{width:Math.round(p.W*k),height:Math.round(p.H*k)},
        floating:{horizontalPosition:{relative:D.HorizontalPositionRelativeFrom.PAGE,offset:0},verticalPosition:{relative:D.VerticalPositionRelativeFrom.PAGE,offset:0},behindDocument:true,allowOverlap:true}
      })]})];
      p.lines.forEach(l=>{
        kids.push(new D.Paragraph({
          frame:{type:'absolute',position:{x:Math.min(tw(l.x),pw-600),y:Math.min(tw(l.y),ph-300)},width:Math.min(Math.round(tw(l.w)*1.2)+400,pw-tw(l.x)>600?pw-tw(l.x):600),height:tw(l.h),anchor:{horizontal:D.FrameAnchorType.PAGE,vertical:D.FrameAnchorType.PAGE}},
          spacing:{before:0,after:0,line:Math.max(200,tw(l.h)),lineRule:D.LineRuleType.EXACT},
          children:[new D.TextRun({text:l.t,size:Math.max(8,Math.round(l.fs*k*.75*2*(Math.min(1,l.sx)))),color:l.color.slice(1).toUpperCase(),font:{ascii:'Arial',hAnsi:'Arial',eastAsia:'MS Gothic'}})]
        }));
      });
      return{properties:{page:{size:{width:pw,height:ph},margin:{top:0,right:0,bottom:0,left:0}}},children:kids};
    });
    save(await D.Packer.toBlob(new D.Document({sections})),'hasil-ocr.docx');
    setStatus('Word diunduh.');
  }catch(e){console.error(e);setStatus('Gagal membuat Word: '+e.message);}
};
</script>
</body></html>
